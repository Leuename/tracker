# Nightly snapshot of the Supabase workspace into backups/.
#
# The project is on the Supabase free plan, where backups exist but cannot be
# downloaded. This is the only restore path, so it runs on a schedule rather
# than when someone remembers.
#
# It signs in as an ordinary account, not with a service_role key: the whole
# point of reading through RLS is that this credential can do nothing the three
# people cannot already do by hand.
name: Backup

on:
  schedule:
    # Twice a day, evenly spaced, so the worst case between a change and the
    # snapshot that holds it is 12 hours rather than 24.
    #
    # The spacing is the whole point, so do not "tidy" these hours. 18:00 + 06:00
    # gives two 12 h gaps. 18:00 + 09:00 — which was floated first — gives 9 h
    # and 15 h, so it makes the worst case 15 h while looking like an
    # improvement. Two runs only help by how far apart they are.
    #
    # 18:00 UTC = 02:00 in Manila, after the working day.
    - cron: '0 18 * * *'
    # 06:00 UTC = 14:00 in Manila, mid-afternoon, so a morning's work is captured
    # before the evening run rather than surviving on one copy until 02:00.
    - cron: '0 6 * * *'
  workflow_dispatch: # so a run can be forced from the Actions tab

# Needed to push the snapshot back. Nothing else is granted.
permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22 or newer: supabase-js reaches for a native WebSocket at
          # createClient, and Node 20 has none, so the script dies on import
          # long before it signs in. Matches the version used locally.
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # apps/web holds the only package manifest in this repository.
      - run: npm ci
        working-directory: apps/web

      - run: npm run backup
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

      - name: Commit the snapshot
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backups
          # The manifest carries a timestamp, so there is normally something to
          # commit. Guarded anyway: a no-op run must not fail the workflow.
          # [skip ci] is kept for any CI added later; Vercel ignores it —
          # tested, it deployed anyway. What actually stops the nightly
          # redeploy is `ignoreCommand` in apps/web/vercel.json.
          git diff --staged --quiet || git commit -m "Back up the workspace [skip ci]"
          git push
